[package]
name = "reverse-ssh-tunnel-with-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dirs = "6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0ab9cf4ed6d237457e66efc56c8ffcf915e8ce05", features = ["gpui-fast"] }

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0ab9cf4ed6d237457e66efc56c8ffcf915e8ce05", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false
